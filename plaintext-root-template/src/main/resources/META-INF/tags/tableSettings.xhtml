<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:fn="jakarta.tags.functions"
                xmlns:a="jakarta.faces.passthrough"
                xmlns:p="http://primefaces.org/ui">
    <!--
      pt:tableSettings — der Bedienbereich einer Tabelle: Kopfleiste mit dem Regler-Symbol und
      dem Panel für Modus, Profil, Ansicht und Spalten (Karte 1853, Mockup Variante A; vorher
      Fieldset, Karte 1336). Runde 7 (Daniel 13.11.): Reiter «Breiten» entfernt — Breiten zieht
      man im Modus Resize; die Ansicht haelt einen festen Stand (Breiten + Reihenfolge) fest, der
      mit ins Profil wandert, ein Doppelklick auf den Modus-Knopf stellt ihn wieder her.

      WARUM ALS TAG UND NICHT ALS KOPIERVORLAGE:
      Diese Bedienung ist rund 300 Zeilen Markup, davon die Haelfte Ajax-Verdrahtung. Wer sie
      kopiert, kopiert auch die Fehler mit — und repariert sie danach an einer Stelle. Im Bestand
      einer einzigen App standen drei Seiten mit derselben Einblendung und drei verschiedenen
      Standen: eine ohne Breiten-Zuruecksetzen, eine mit einem Profil-Dialog ohne Abbrechen, eine
      mit layout="grid" am selectManyCheckbox (das in PrimeFaces 15 eine FacesException wirft und
      die Seite weiss laesst — auf Produktion aufgefallen, nicht im Build).

      DER GEGENPART IN JAVA: ch.plaintext.boot.table.TableSettings - seit Karte 2086 nur noch im
      Artefakt plaintext-root-tablesettings (root-common haengt davon ab; vorher root-common,
      bis 1.668.0 plaintext-root-web). Das Tag rendert nur; alles, was es abfragt, steht dort.

      ABLAGE AUSTAUSCHEN (Karte 2086): Die Backing-Bean laesst sich einen TableStateStore
      injizieren und reicht ihn an anzeige.init(store, spalten) weiter. root bringt per
      AutoConfiguration UserPreferenceTableStateStore mit (je Benutzer und Mandant, JSON in
      UserPreference) - aber nur, solange die App KEINE eigene TableStateStore-Bean hat. Eigene
      Ablage = eigene Bean, ohne Property, ohne Exclude, ohne @Primary. Wem der Stand gehoert,
      sagt die Bean TableStateOwner (Benutzer, Mandant); ein eigener Store injiziert sie, statt
      selbst die Security zu fragen.

      SEITEN-API (Karte 2086, aus dem Inventar): new TableSettings(seite, mitBreiten,
      PagingVorgabe.oben/unten/beides(zeilen) | aus()); an p:column displayPriority=
      "#{x.anzeige.displayPriority('key')}" (Bloecke am Ende: #{x.anzeige.prioAmEnde});
      anzeige.pageValue/pageFlag/setPageValue (Filter, Schalter - wandern mit ins Profil);
      anzeige.setSpaltenBedingung(key, () -> ...) (zaehlt in der Breitensumme nur, wenn
      gerendert); anzeige.setNachProfilwechsel(() -> ...); anzeige.neuAufsetzen(seite, store,
      spalten); TableColumn listenLabel / waehlbar / verschiebbar (ausBlock, blockPlatzhalter,
      knopfSpalte) - nicht waehlbare Spalten haben im Panel keinen Schalter, nicht verschiebbare
      stehen nicht in der Reihenfolge-Liste; anzeige.state.expand/collapse/isExpanded(zeile).

      KOPFLEISTE UND PANEL (Karte 1853): Die Kopfleiste der Tabelle traegt NUR das Regler-Symbol;
      die Schalter «Verschieben» / «Grösse ändern» und «Standard setzen» wohnen im Panel
      (Nachtrag Daniel 23.11., geht dem Mockup vor). Die Schalter wirken ueber die Bindung der
      Seite: draggableColumns / resizableColumns an #{x.anzeige.verschiebenAktiv} und
      #{x.anzeige.groesseAendernAktiv}, das Ziehen im Kopf meldet <p:ajax event="colReorder">
      an #{x.anzeige.onColReorder(event, tabelle)} (Signatur AjaxBehaviorEvent + Tabellen-
      Suchausdruck; update muss den Tag-Wrap <ptSettingsId>-bereich UND die Tabelle mitrendern —
      Vorbild: guild member.xhtml). Ohne diese drei Zeilen an der Tabelle bleiben die Schalter
      wirkungslos (das Tag kann fremde Komponenten nur anbieten, nicht verdrahten) — und ohne
      eingeschalteten Schalter haengt auch kein Griff im Spaltenkopf (Runde 7: table-settings.css
      liest den Modus direkt an der Tabelle - ui-draggable-column / ui-datatable-resizable).

      REIHENFOLGE: Gespeichert wird in TableState.columnOrder; kurz vor dem Rendern sortiert
      das Tag die Spalten-Kinder der Tabelle ueber f:event preRenderComponent um. PrimeFaces
      rendert statische p:column in Komponenten-Reihenfolge — ohne diesen Schritt waere die
      gespeicherte Reihenfolge nach jedem Neuladen wieder weg.

      MOBIL (Entscheid 2 der Karte 1077): unter 768px — derselbe Umbruch wie in
      mobile-responsive.css — gelten gespeicherte Spaltenbreiten NICHT. table-settings.css setzt
      Tabellen- und Spaltenbreiten auf auto zurueck und blendet die Breitenfelder und den
      Setzen-Knopf aus; die Sichtbarkeit der Spalten und die Profile gelten weiter.

      PFLICHT:
        anzeige   das TableSettings-Objekt der Seite, z.B. #{projektBackingBean.anzeige}
        tabelle   Suchausdruck der Tabelle fuer die Ajax-Updates, z.B. ":fm:tbl".
                  ABSOLUT angeben (fuehrender Doppelpunkt), sonst findet ein Update die Tabelle
                  nicht, sobald Bereich und Tabelle in verschiedenen NamingContainern liegen.

      OPTIONAL:
        settingsId    Praefix fuer die eigenen Komponenten-IDs; Vorgabe "anz". Nur noetig, wenn
                      zwei Bedienbereiche auf derselben Seite stehen.
        tabelleDomId  DOM-Id der Tabelle fuer das Skript; Vorgabe: tabelle ohne fuehrenden
                      Doppelpunkt. Nur noetig, wenn "tabelle" kein einfacher Pfad ist
                      (@widgetVar(...), @form und aehnliche PrimeFaces-Suchausdruecke).
        legend        Titel der Kopfleiste (Barrierefreiheit); Vorgabe "Anzeige einrichten". Vor
                      Karte 1853 Beschriftung des Fieldsets — Seiten mit dem Attribut behalten ihre
                      Beschriftung an der Toolbar.
        spalten       ungenutzt (Vorgabe 4, frueher Rasterbreite der Checkboxen).

      PAGINATOR UND SEITENGROESSE (Karte 1336) wirken nur, wenn die Seite ihre Tabelle daran
      bindet — derselbe Weg wie bei Breite (style/tableStyle) und Sichtbarkeit (rendered):
        paginator="#{x.anzeige.paginator}" paginatorPosition="#{x.anzeige.paginatorPosition}"
        rows="#{x.anzeige.rows}" rowsPerPageTemplate="#{x.anzeige.rowsPerPageTemplate}"
        <p:ajax event="page" listener="#{x.anzeige.onPage}"/>
      Die Vorgabe der Zeilen pro Seite gibt die Seite im Konstruktor mit:
      new TableSettings("seite", true, 200).

      DER RUMPF des Tags wird im Spalten-Reiter als zusaetzliche Schnellschalter neben
      «Alle ein», «Alle aus» und «Standard» gerendert — dort gehoeren seitenspezifische
      Knoepfe hin ("Nur Pflichtspalten", ...).

      WARUM DIE EIGENEN UPDATES RELATIV SIND (":fm:cols" waere falsch):
      Alle Komponenten dieses Tags liegen im selben NamingContainer wie die Knoepfe, die sie
      aktualisieren — ein relativer Ausdruck findet sie deshalb immer, auch innerhalb eines
      p:tabView oder eines beliebig benannten Formulars. Mit fest verdrahteten ":fm:"-Pfaden
      liess sich der Bereich nicht in einen Reiter stellen; das war der Grund, warum er in einer
      App aus dem tabView herausgezogen werden musste.

      Ein Tag-File wird beim Baumaufbau inline expandiert — es entsteht KEIN NamingContainer, und
      die IDs unten liegen wirklich im umgebenden Formular. Genau deshalb funktioniert das hier
      und mit einer Composite Component nicht.
    -->
    <c:set var="ptSettingsId" value="#{empty settingsId ? 'anz' : settingsId}"/>
    <c:set var="ptTabelleDom" value="#{empty tabelleDomId
                                       ? (fn:startsWith(tabelle, ':') ? fn:substring(tabelle, 1, -1) : tabelle)
                                       : tabelleDomId}"/>
    <!-- Texte des Bedienbereichs (Karte 1853 Runde 6, mehrsprachig de/en/fr/it); die Growl-
         Meldungen aus TableSettings laufen ueber dasselbe Bundle (TableSettings#text). Per
         anzeige.texte statt f:loadBundle: letzteres folgt der ViewRoot-Locale (fest de) und
         blieb fuer Sprache=en-Benutzer deutsch (claude2-Befund). T() nicht nutzbar — Jakarta
         EL kennt es nicht (SpEL, tomcat-embed-el belegt). -->
    <c:set var="ts" value="#{anzeige.texte}"/>

    <!-- Die Klammer um alles: sie traegt die data-Attribute und ist zugleich der Suchraum des
         Skripts. Ohne sie muesste js/table-settings.js die zusammengehoerigen Teile ueber IDs
         finden — und zwei Bedienbereiche auf einer Seite waeren nicht auseinanderzuhalten. -->
    <!-- Klasse statt :has() am CSS: die Tabelle ist kein direktes Geschwister des Wraps
         (Panel/Dialog/remoteCommand liegen dazwischen), der alte Selektor griff nie. -->
    <h:panelGroup layout="block"
                  styleClass="pt-tablesettings-wrap#{anzeige.paginatorOben ? ' pt-ts-paginator-oben' : ''}"
                  id="#{ptSettingsId}-bereich"
                  binding="#{anzeige.reihenfolgeZiel}"
                  a:data-pt-tablesettings="#{ptTabelleDom}"
                  a:data-pt-breiten="#{anzeige.mitBreiten ? '1' : ''}"
                  a:data-pt-settings-id="#{ptSettingsId}">

        <!-- Reihenfolge der Spalten-Kinder vor jedem Rendern an den gespeicherten Stand anpassen
             (Karte 1853). Dieses Ereignis feuert am Wrap, der im Markup vor der Tabelle steht —
             die Tabelle wird danach in der neuen Reihenfolge gerendert. -->
        <f:event type="preRenderComponent" listener="#{anzeige.reihenfolgeAnwenden(tabelle)}"/>

        <!-- Kopfleiste: NUR das Regler-Symbol (Nachtrag Karte 1853, Daniel 23:16 — geht dem Mockup
             vor): die Schalter und «Standard setzen» wohnen im Panel, hier steht nichts weiter.
             Meldungen laufen seit Runde 6 als Growl (globalGrowl des Templates) — ein eigenes
             Meldungs-Panel gibt es nicht mehr. -->
        <h:panelGroup layout="block" styleClass="pt-ts-toolbar" id="#{ptSettingsId}-toolbar"
                      a:aria-label="#{empty legend ? ts['toolbar.label'] : legend}">
            <p:commandButton id="#{ptSettingsId}-oeffnen" type="button"
                             icon="pi pi-sliders-h"
                             styleClass="ui-button-outlined pt-ts-oeffner"
                             title="#{ts['oeffner.titel']}"/>

            <!-- Kein eigenes p:growl hier (Karte 1547, EinGrowlProSeiteTest): die FacesMessages
                 aus TableSettings#growl zeigt das globalGrowl des Templates. -->
        </h:panelGroup>

        <!-- Wrap-Schluss HIER (Karte 1853, Runde 5): das OverlayPanel, der Profil-Dialog und der
             Breiten-remoteCommand liegen ausserhalb des Wraps. Der Wrap bleibt Ajax-Ziel des
             Reorder (Persist laeuft ueber sein preRenderComponent) — und weil die Panel-SHELL
             nicht mehr im Wrap liegt, bleibt das Panel bei Reihenfolge-Aenderung und jedem
             Toggle OFFEN (Daniel 16:21, Punkt 3). -->
    </h:panelGroup>

        <!-- Das schwebende Panel: Schalter zuoberst, dann Profil, dann die drei Reiter.
             dismissable: Klick ausserhalb schliesst (Mockup Variante A). -->
        <!-- Kein for: PF wuerde den Click-Handler am Oeffner binden und nach einem colReorder-
             Re-Render des Wraps das ersetzte Element referenzieren (Befund claude2). Das Panel
             oeffnet die Delegation in js/table-settings.js (document-Klick auf .pt-ts-oeffner,
             ueberlebt Teil-Updates, CSP ohne unsafe-inline). -->
        <p:overlayPanel id="#{ptSettingsId}-panel"
                        widgetVar="#{ptSettingsId}PanelWv"
                        styleClass="pt-ts-panel" dismissable="true"
                        hideEffect="fade" showEffect="fade">
            <h:panelGroup layout="block" id="#{ptSettingsId}-panelInhalt">
            <!-- Kopfzeile des Panels (Runde 6, Karte 1853): EIN Dreifach-Schalter rotiert durch
                 «Anpassen» (beide aus) -> «Verschieben» (Koepfe ziehbar) -> «Vergroessern»
                 (Breiten ziehbar) -> zurueck. Die Seite bindet draggableColumns/resizableColumns
                 an dieselben zwei Eigenschaften — der Schalter setzt genau sie. Ohne aktiven Modus
                 haengt auch kein Griff im Spaltenkopf. Profilzeile rechts: Auswahl, Neu, Papierkorb. -->
            <h:panelGroup layout="block" styleClass="pt-ts-kopfzeile">
                <!-- Runde 7: Klick wechselt den Modus, Doppelklick stellt den festen Stand her. Beides
                     ueber remoteCommands (unten), ausgeloest von js/table-settings.js - ein Ajax-
                     Knopf haette beim Doppelklick zweimal den Modus gewechselt. Adjust = outline,
                     Reorder/Resize gefuellt (Punkt 7). -->
                <h:panelGroup layout="block" styleClass="pt-ts-schalterzeile">
                    <p:commandButton id="#{ptSettingsId}-modus" type="button"
                                     value="#{anzeige.modusLabel}"
                                     icon="#{anzeige.modusIcon}"
                                     styleClass="pt-ts-modus#{anzeige.modus == 0 ? ' ui-button-outlined' : ''}"
                                     title="#{anzeige.modusTitel}"/>
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="pt-ts-profilzeile">
                    <h:outputText value="#{ts['profil.label']}" styleClass="pt-tablesettings-label"/>

                    <p:selectOneMenu id="#{ptSettingsId}-profileSelect" value="#{anzeige.selectedProfile}">
                        <f:selectItems value="#{anzeige.profileNames}"/>
                        <p:ajax event="change" process="@this"
                                listener="#{anzeige.profilAnwenden(tabelle)}"
                                update="#{tabelle} #{ptSettingsId}-panelInhalt"/>
                    </p:selectOneMenu>

                    <p:commandButton value="#{ts['profil.neu']}" icon="pi pi-plus"
                                     process="@this" update="#{ptSettingsId}-profileDialog"
                                     oncomplete="PF('#{ptSettingsId}ProfileDlg').show();"
                                     title="#{ts['profil.neu.titel']}"/>

                    <p:commandButton icon="pi pi-trash"
                                     action="#{anzeige.deleteProfile()}"
                                     process="@this #{ptSettingsId}-profileSelect"
                                     update="#{ptSettingsId}-panelInhalt"
                                     rendered="#{anzeige.profileActive}"
                                     styleClass="ui-button-danger pt-ts-papierkorb"
                                     title="#{ts['profil.loeschen.titel']}"
                                     aria-label="#{ts['profil.loeschen']}"/>
                </h:panelGroup>
            </h:panelGroup>

            <p:tabView styleClass="pt-ts-tabs">
                <!-- ── Ansicht: Paginator und Seitengroesse (Karte 1336) ────────────────────── -->
                <p:tab title="#{ts['tab.ansicht']}">
                    <h:panelGroup layout="block" id="#{ptSettingsId}-paginator" styleClass="pt-tablesettings-paginator">
                        <h:panelGroup layout="block" styleClass="pt-ts-paginator-zeile">
                            <h:outputText value="#{ts['paginator.label']}" styleClass="pt-tablesettings-label"/>
                            <h:panelGroup layout="block" styleClass="pt-ts-paginator-boxen">
                                <p:selectBooleanCheckbox id="#{ptSettingsId}-paginatorOben" value="#{anzeige.paginatorOben}"
                                                         itemLabel="#{ts['paginator.oben']}">
                                    <p:ajax process="@this" listener="#{anzeige.onPaginatorChange(tabelle)}"
                                            update="#{tabelle} #{ptSettingsId}-paginator #{anzeige.reihenfolgeZielClientId}"/>
                                </p:selectBooleanCheckbox>
                                <p:selectBooleanCheckbox id="#{ptSettingsId}-paginatorUnten" value="#{anzeige.paginatorUnten}"
                                                         itemLabel="#{ts['paginator.unten']}">
                                    <p:ajax process="@this" listener="#{anzeige.onPaginatorChange(tabelle)}"
                                            update="#{tabelle} #{ptSettingsId}-paginator #{anzeige.reihenfolgeZielClientId}"/>
                                </p:selectBooleanCheckbox>
                            </h:panelGroup>
                        </h:panelGroup>
                        <h:panelGroup layout="block" styleClass="pt-ts-seitengroesse-zeile">
                            <h:outputText value="#{ts['seitengroesse.label']}" styleClass="pt-tablesettings-label"/>
                            <p:selectOneMenu id="#{ptSettingsId}-seitengroesse" value="#{anzeige.seitengroesse}"
                                             disabled="#{not anzeige.paginator}"
                                             style="min-width:90px;">
                                <f:selectItems value="#{anzeige.seitengroessen}"/>
                                <p:ajax event="change" process="@this"
                                        listener="#{anzeige.onSeitengroesseChange(tabelle)}"
                                        update="#{tabelle}"/>
                            </p:selectOneMenu>
                            <h:outputText value="#{ts['paginator.hint']}"
                                          rendered="#{not anzeige.paginator}"
                                          styleClass="pt-tablesettings-hint"/>
                        </h:panelGroup>
                    </h:panelGroup>
                    <!-- Fester Stand (Runde 7, Punkt 2): Breiten + Reihenfolge festhalten; steht im
                         Profil. Wiederherstellen per Doppelklick auf den Modus-Knopf (Punkt 3). -->
                    <h:panelGroup layout="block" id="#{ptSettingsId}-festerStand" styleClass="pt-ts-fester-stand">
                        <h:outputText value="#{ts['festerStand.label']}" styleClass="pt-tablesettings-label"/>
                        <p:commandButton id="#{ptSettingsId}-festhalten" value="#{ts['festerStand.erfassen']}"
                                         icon="pi pi-bookmark"
                                         action="#{anzeige.festerStandErfassen()}"
                                         process="@this" update="#{ptSettingsId}-festerStand"
                                         styleClass="ui-button-outlined"
                                         title="#{ts['festerStand.erfassen.titel']}"/>
                        <h:outputText value="#{anzeige.festerStandErfasst ? ts['festerStand.vorhanden'] : ts['festerStand.keiner']}"
                                      styleClass="pt-tablesettings-hint"/>
                    </h:panelGroup>
                </p:tab>

                <!-- ── Spalten: Sichtbarkeit und Reihenfolge (Karte 1853) ───────────────────── -->
                <p:tab title="#{ts['tab.spalten']}">
                    <h:panelGroup layout="block" styleClass="pt-ts-spaltenknoepfe">
                        <p:commandButton value="#{ts['spalten.alleEin']}" icon="pi pi-check-square"
                                         action="#{anzeige.alleSpaltenEin()}"
                                         update="#{tabelle} #{ptSettingsId}-reihenfolge" process="@this"
                                         styleClass="ui-button-outlined" style="margin-right:6px;"/>
                        <p:commandButton value="#{ts['spalten.alleAus']}" icon="pi pi-times"
                                         action="#{anzeige.alleSpaltenAus()}"
                                         update="#{tabelle} #{ptSettingsId}-reihenfolge" process="@this"
                                         styleClass="ui-button-outlined" style="margin-right:6px;"
                                         title="#{ts['spalten.alleAus.titel']}"/>
                        <p:commandButton value="#{ts['spalten.standard']}" icon="pi pi-undo"
                                         action="#{anzeige.standardSpalten()}"
                                         update="#{tabelle} #{ptSettingsId}-reihenfolge" process="@this"
                                         styleClass="ui-button-outlined" style="margin-right:6px;"/>
                        <ui:insert/>
                    </h:panelGroup>

                    <!-- Griff zum Ziehen; der Schalter pro Zeile steuert die Sichtbarkeit. Reihenfolge
                         und Sichtbarkeit bleiben je Benutzer gespeichert. Die Pfeil-Buttons der
                         Liste sind ausgeblendet (Runde 4) — das Ziehen am Griff reicht, die Liste
                         ist dafuer laenger und von Hand vergroesserbar (CSS). -->
                    <p:orderList id="#{ptSettingsId}-reihenfolge"
                                 value="#{anzeige.spaltenReihenfolge}" var="key" itemValue="#{key}"
                                 styleClass="pt-ts-reihenfolge">
                        <!-- PF 16 OrderList verbraucht das reorder-Event komplett intern (customEvents,
                             ueberschreibt auch validate) — der Listener unten laeuft nie. Gesichert
                             wird stattdessen beim erneuten Rendern nach dem Request: das _values-Feld
                             der Liste traegt die neue Ordnung mit, preRenderComponent am Wrap liest
                             es (TableSettings.reihenfolgeAnwenden, Feldweg). Dazu muss der Wrap
                             Teil des reorder-Updates sein — direkt vor der Tabelle, damit die
                             Spalten-Kinder vor deren Rendern umgeordnet sind. Der Wrap kommt per
                             binding in das Ziel: aus der Liste (NamingContainer) heraus ist keine
                             relative Id moeglich, die Form-Id kennt das Tag nicht. Playwright-
                             validiert: Drag -> Reload -> Reihenfolge steht. -->
                        <p:ajax event="reorder" process="@this"
                                listener="#{anzeige.onReihenfolgeGeaendert(tabelle)}"
                                update="#{anzeige.reihenfolgeZielClientId} #{tabelle}"/>
                        <p:column styleClass="pt-ts-spalte-griff">
                            <i class="pi pi-ellipsis-v pt-ts-griff" title="#{ts['spalten.griff.titel']}"/>
                            <h:outputText value="#{anzeige.columnLabel(key)}" styleClass="pt-ts-spaltenlabel"/>
                            <p:tag value="#{ts['spalten.pflicht']}" severity="info" styleClass="pt-ts-pflicht"
                                   rendered="#{anzeige.pflichtspalte(key)}"/>
                        </p:column>
                        <p:column styleClass="pt-ts-spalte-schalter">
                            <!-- Karte 1853/1904: schlichte Checkbox statt p:toggleSwitch. p:orderList ist
                                 keine Iterationskomponente - alle Schalter darin bekamen dieselbe
                                 Widget-Id ohne Zeilenindex, keiner fand sein Element, ein Klick
                                 schickte nichts ab. Die Checkbox meldet Schluessel und Zustand ueber
                                 den remoteCommand unter der Liste (Listener in js/table-settings.js,
                                 kein on…-Attribut: CSP ohne 'unsafe-inline'). -->
                            <!-- Karte 2086: nicht waehlbare Spalten (TableColumn.waehlbar=false, z.B.
                                 Knopfspalten) haben keinen eigenen Schalter - sie bleiben sichtbar. -->
                            <ui:fragment rendered="#{anzeige.waehlbar(key)}">
                            <input type="checkbox" class="pt-ts-schalter-sichtbar" role="switch"
                                   data-spalte="#{key}"
                                   checked="#{anzeige.isVisible(key) ? 'checked' : null}"
                                   disabled="#{anzeige.pflichtspalte(key) ? 'disabled' : null}"
                                   aria-label="#{anzeige.columnLabel(key)}"
                                   title="#{anzeige.pflichtspalte(key) ? ts['spalten.pflicht.titel'] : ts['spalten.schalter.titel']}"
                                   data-pt-remote="#{ptSettingsId}SpalteSichtbar"/>
                            </ui:fragment>
                        </p:column>
                    </p:orderList>
                    <p:remoteCommand name="#{ptSettingsId}SpalteSichtbar" process="@this"
                                     actionListener="#{anzeige.onSpalteSichtbarGemeldet}"
                                     update="#{tabelle}"
                                     ignoreAutoUpdate="true"/>

                    <h:outputText value="#{ts['spalten.hint']}"
                                  styleClass="pt-tablesettings-hint"/>
                </p:tab>

            </p:tabView>
            </h:panelGroup>
        </p:overlayPanel>

        <!-- Neues-Profil-Dialog: ausserhalb des OverlayPanels — ein Dialog gehoert ans Ende des
             Formulars, nicht in ein per JavaScript verschobenes Panel. -->
        <p:dialog header="#{ts['dialog.titel']}" widgetVar="#{ptSettingsId}ProfileDlg" modal="true"
                  resizable="false" width="380" id="#{ptSettingsId}-profileDialog">
            <h:panelGroup layout="block" style="padding:8px 0;">
                <h:outputText value="#{ts['dialog.name']}" style="margin-right:8px;"/>
                <p:inputText id="#{ptSettingsId}-newProfileName" value="#{anzeige.newProfileName}"
                             style="width:100%; margin-top:6px;"/>
            </h:panelGroup>
            <f:facet name="footer">
                <p:commandButton value="#{ts['dialog.anlegen']}" icon="pi pi-check"
                                 action="#{anzeige.createProfile()}"
                                 process="@this #{ptSettingsId}-newProfileName"
                                 update="#{ptSettingsId}-panel"
                                 oncomplete="PF('#{ptSettingsId}ProfileDlg').hide();"/>
                <p:commandButton value="#{ts['dialog.abbrechen']}" type="button"
                                 styleClass="ui-button-secondary"
                                 onclick="PF('#{ptSettingsId}ProfileDlg').hide();"/>
            </f:facet>
        </p:dialog>

        <!-- Modus-Knopf (Runde 7): js/table-settings.js ruft bei Klick <id>ModusWechseln, bei
             Doppelklick <id>FesterStand. Ohne ignoreAutoUpdate, damit das Growl erscheint. -->
        <p:remoteCommand name="#{ptSettingsId}ModusWechseln" process="@this"
                         action="#{anzeige.modusWechseln()}"
                         update="#{tabelle} #{ptSettingsId}-panelInhalt"/>
        <p:remoteCommand name="#{ptSettingsId}FesterStand" process="@this"
                         action="#{anzeige.festerStandHerstellen(tabelle)}"
                         update="#{tabelle} #{ptSettingsId}-panelInhalt"/>

        <!-- Skript und Stil IMMER laden (Runde 7): Oeffner und Modus-Knopf laufen ueber das Skript,
             auch auf Seiten ohne Spaltenbreiten. Die Griffe im Spaltenkopf (Verschieben: Symbol
