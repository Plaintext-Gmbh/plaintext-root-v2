name: Repo-Lint

# ═══════════════════════════════════════════════════════════════════════════════
#  plaintext-root-v2: STUB. Die upstream-Fassung dieser Datei (plaintext-root) laeuft auf dem
#  self-hosted NAS-Runner und liest mit MVN_DEPLOY_TOKEN die Flyway-Nummern der vier PRIVATEN
#  Repos. Beides gibt es fuer v2 nicht: der eine Runner gehoert den bestehenden Repos (Karte 1563),
#  und v2 besitzt das Secret nicht. Die Datei bleibt bestehen (merge=ours in .gitattributes),
#  damit der Sync von upstream keinen Modify/Delete-Konflikt erzeugt — sie tut aber nichts,
#  ausser auf Wunsch zu sagen, dass sie nichts tut.
#
#  Die Flyway-Dubletten INNERHALB von v2 prueft .woodpecker/build.yml (Schritt flyway-dubletten)
#  auf jedem Pull Request. Die repo-uebergreifende Pruefung gegen app/guild/schuetu/iot kommt
#  ueber den Sync von upstream mit: dort laeuft sie, und was dort gruen war, kommt hierher.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-lint:
    name: Repo-Lint (in v2 nicht aktiv)
    runs-on: ubuntu-latest
    steps:
      - run: echo "plaintext-root-v2 fuehrt den upstream-Repo-Lint nicht aus (Stub, siehe Kopf der Datei)."
