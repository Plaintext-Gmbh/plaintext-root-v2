name: renovate

on:
  schedule:
    # Einmal pro Woche (Daniels Wort, Karte 2029: "einmal in der Woche durch die GitHub agents").
    # Montag 04:23 UTC.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
