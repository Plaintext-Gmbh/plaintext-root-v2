# ═══════════════════════════════════════════════════════════════════════════════
#  plaintext-root-v2 — Woodpecker workflow 1 of 3: BUILD & TEST (Karte 1563)
#
#  v2-FASSUNG dieser Datei. Sie steht in .gitattributes auf `merge=ours`: der Sync von upstream
#  (v2/sync.sh) behaelt sie und meldet nur, wenn upstream seine build.yml geaendert hat.
#  Unterschiede zu upstream plaintext-root/.woodpecker/build.yml:
#    * zwei v2-Schritte vorneweg (Umbenennungs-Selbsttest, Purge-Unit-Tests, Skript-Syntax)
#    * Lader-Probe nach dem Build: Huelle + released plaintext-z-verrechnung ueber loader.path
#      gegen eine LEERE zweite Postgres (Service postgres-probe), Belege im Log — Karte 1563 (e)
#    * sonst wortgleich (Flyway-Dubletten, build-und-test, Coverage, Testbericht)
#
#  Runs ONLY if `.ci-engine` in the repo root contains the word `woodpecker` (waechter.sh).
#  Kein `push: master` hier — auf master baut deploy.yml (M1, build once), wie in root.
# ═══════════════════════════════════════════════════════════════════════════════

when:
  - event: pull_request
  - event: manual
  # Kein `event: cron`: fuer v2 gibt es keine Crons (Entscheid Daniel 22.10.2026).

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      tags: true

services:
  # Wegwerf-Testdatenbank fuer die Unit-Tests (EmbeddedPg startet als root keinen eigenen Server,
  # Karte 451). Nicht geheim, lebt nur in diesem Lauf.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plaintext_root
      POSTGRES_USER: plaintext
      POSTGRES_PASSWORD: plaintext
  # LEERE Datenbank fuer die Lader-Probe: nichts ausser dem, was die Huelle und das Modul beim
  # Start selbst migrieren. Eigener Container, damit die Unit-Tests oben nichts hinterlassen.
  postgres-probe:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plaintext_probe
      POSTGRES_USER: plaintext
      POSTGRES_PASSWORD: plaintext

steps:
  # ── v2: Umbenennung und Skripte (Sekunden) ────────────────────────────────────────────
  v2-umbenennung:
    image: maven:3.10-eclipse-temurin-25
    commands:
      - . .woodpecker/waechter.sh
      # Selbsttest = Fixture (Reaktor-Koordinate umbenannt, Fremd-Artefakt bleibt, Imports unberuehrt),
      # Idempotenz (zweimal laufen = keine Aenderung) und Grep-Test auf dem echten Baum.
      - bash v2/umbenennen.sh --selbsttest
      - bash -n v2/release.sh && bash -n v2/sync.sh && bash -n v2/lader-probe.sh && bash -n v2/test-lader-probe-auswahl.sh && bash -n scripts/release-vollstaendig.sh
      # Auswahl der Modulversion fuer :latest (root-min <= Huelle) an einer Attrappe, ohne Netz und DB
      - bash v2/test-lader-probe-auswahl.sh
      # Der Release-Lauf wuerde mit dieser Wurzel-groupId arbeiten — hier sichtbar gemacht.
      - 'echo "Wurzel-groupId: $(mvn -q -N help:evaluate -Dexpression=project.groupId -DforceStdout)"'

  v2-purge-tests:
    # Eigenes, kleines Bild: das Maven-Bild hat kein python3, und das Purge-Skript braucht nichts
    # als die Standardbibliothek. 16 Tests, darunter der Negativtest (v1-Kandidat -> Abbruch).
    image: python:3.13-alpine
    commands:
      - . .woodpecker/waechter.sh
      - python3 -I v2/test_purge.py

  # ── Flyway-Dubletten (Karte 1120/1121), wortgleich mit upstream ───────────────────────
  flyway-dubletten:
    image: maven:3.10-eclipse-temurin-25
    commands:
      - . .woodpecker/waechter.sh
      # SHA-gepinnt (Karte 1093): plaintext-scripts ist oeffentlich. Pin wie upstream (08.09.2026).
      - >-
        mkdir -p /tmp/werkzeuge &&
        git -C /tmp/werkzeuge init -q &&
        git -C /tmp/werkzeuge remote add origin https://github.com/Plaintext-Gmbh/plaintext-scripts.git &&
        git -C /tmp/werkzeuge fetch -q --depth 1 origin 978714ee05b2527256588962981a889b9e157b00 &&
        git -C /tmp/werkzeuge checkout -q FETCH_HEAD
      - git config --global --add safe.directory "$(pwd)"
      - git fetch -q origin +refs/heads/master:refs/remotes/origin/master
      - bash /tmp/werkzeuge/quality/flyway-dubletten-lint.sh . --basis origin/master

  # ── Build & Test, wortgleich mit upstream (Karte 1542: eigenes lokales Repo je Lauf) ──
  build-und-test:
    image: maven:3.10-eclipse-temurin-25
    environment:
      MAVEN_ARGS: "-Dmaven.repo.local=/woodpecker/m2-pipeline -Dmaven.repo.local.tail=/root/.m2/repository -Dmaven.build.cache.location=/root/.m2/build-cache"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plaintext_root
      SPRING_DATASOURCE_USERNAME: plaintext
      SPRING_DATASOURCE_PASSWORD: plaintext
      MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"
    commands:
      - . .woodpecker/waechter.sh
      - >-
        bash -c 'for i in $(seq 1 60); do
          (echo > /dev/tcp/postgres/5432) 2>/dev/null && { echo "postgres bereit nach $i Versuchen"; exit 0; };
          sleep 2;
        done;
        echo "FEHLER: Service-Container postgres nach 120 s nicht erreichbar." >&2;
        exit 1'
      # JaCoCo-Gate (40 %) und ArchUnit-Regeln sind scharf — ein rotes Modul ist ein Befund, kein
      # Pipeline-Fehler. Kein Abschalten des exec-Classifiers, kein -Droot.dual.publish=false.
      - >-
        if [ "$CI_PIPELINE_EVENT" = "cron" ]; then
          echo "Cron-Lauf: Quality-Gate-Waechter laeuft MIT.";
          mvn clean install -B -DskipITs;
        else
          echo "Ereignis $CI_PIPELINE_EVENT: Quality-Gate-Waechter ausgeschlossen.";
          mvn clean install -B -DskipITs -DexcludedGroups=quality-gate;
        fi

  # ── Lader-Probe (Karte 1563 e): Huelle + Verrechnungs-Jar gegen leere Postgres ────────
  # Belege im Log dieses Schritts: health UP, "[modul-lader] 1 Module bereit", Registered tools
  # mit/ohne Modul, Modul-Migration im Flyway-Log; Negativproben C (application.yml) und D
  # (Klasse der Huelle) werden abgewiesen. Die Tabelle flyway_schema_history liest der naechste
  # Schritt mit psql, weil das Maven-Bild keins hat.
  #
  # Das Modul-Jar kommt vom Reposilite (maven.plaintext.ch, LAN) — nur dort liegen die privaten
  # app-Artefakte. root-min leitet das Skript aus der Elternkette des Jars ab (plaintext-app-parent
  # -> plaintext-root.version); die Huelle laesst nur Module >= kompatibel-ab (1.767.0) zu.
  lader-probe:
    image: maven:3.10-eclipse-temurin-25
    environment:
      DB_URL: jdbc:postgresql://postgres-probe:5432/plaintext_probe
      DB_USER: plaintext
      DB_PASSWORD: plaintext
      REPOSILITE_BASIS: https://maven.plaintext.ch/releases
      # "latest" = juengstes Release laut maven-metadata.xml, dessen root-min die Huelle laden kann
      # (Exit 3, wenn keine der 15 neuesten passt). Zum Festnageln eine Version eintragen.
      PROBE_MODUL_VERSION: latest
      PROBE_ARBEIT: /woodpecker/lader-probe
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"
    commands:
      - . .woodpecker/waechter.sh
      - >-
        bash -c 'for i in $(seq 1 60); do
          (echo > /dev/tcp/postgres-probe/5432) 2>/dev/null && { echo "postgres-probe bereit nach $i Versuchen"; exit 0; };
          sleep 2;
        done;
        echo "FEHLER: Service-Container postgres-probe nicht erreichbar." >&2; exit 1'
      - mkdir -p "$PROBE_ARBEIT"
      - bash v2/lader-probe.sh --modul-gav "ch.plaintext:plaintext-z-verrechnung:$PROBE_MODUL_VERSION"
      # Erwartete Skripte fuer den psql-Schritt in den Workspace legen (target/ ist gitignored).
      - mkdir -p target/lader-probe && cp "$PROBE_ARBEIT/modul-migrationen.txt" target/lader-probe/

  lader-probe-flyway:
    # psql aus dem Postgres-Bild statt apt-get im Maven-Bild. Liest die DB, die Probe B gefuellt hat.
    image: postgres:18-alpine
    environment:
      PGPASSWORD: plaintext
    commands:
      - . .woodpecker/waechter.sh
      - 'echo "── flyway_schema_history (postgres-probe, juengste 15) ──"'
      - >-
        psql -h postgres-probe -U plaintext -d plaintext_probe
        -c "select installed_rank, version, description, script, success from flyway_schema_history order by installed_rank desc limit 15;"
      - >-
        psql -h postgres-probe -U plaintext -d plaintext_probe -tA
        -c "select 'Migrationen gesamt: ' || count(*) from flyway_schema_history;"
      - >-
        for m in $(cat target/lader-probe/modul-migrationen.txt); do
          n=$(psql -h postgres-probe -U plaintext -d plaintext_probe -tA -c "select count(*) from flyway_schema_history where script='$m' and success");
          if [ "$n" = "1" ]; then echo "BELEG flyway_schema_history: $m angewandt (success=true)";
          else echo "FEHLER: $m fehlt in flyway_schema_history" >&2; exit 1; fi;
        done

  coverage-uebersicht:
    image: maven:3.10-eclipse-temurin-25
    environment:
      MAVEN_ARGS: "-Dmaven.repo.local=/woodpecker/m2-pipeline -Dmaven.repo.local.tail=/root/.m2/repository -Dmaven.build.cache.location=/root/.m2/build-cache"
    when:
      - status: [success, failure]
    commands:
      - . .woodpecker/waechter.sh
      - mvn jacoco:report -B || echo "jacoco:report fehlgeschlagen — Uebersicht bleibt leer."
      - >-
        bash -c 'echo "── Code Coverage — plaintext-root-v2 (Gate: 40 %, scharf) ──";
        find . -path "*/target/site/jacoco/jacoco.csv" | while read -r r; do
          m=$(echo "$r" | sed "s|./\(.*\)/target/.*|\1|");
          missed=$(tail -n +2 "$r" | awk -F, "{s+=\$4} END {print s+0}");
          covered=$(tail -n +2 "$r" | awk -F, "{s+=\$5} END {print s+0}");
          total=$((missed + covered));
          [ "$total" -gt 0 ] && printf "  %-40s %3d%% (%d/%d)\n" "$m" $((covered * 100 / total)) "$covered" "$total";
        done'

  testbericht:
    # Allure-Bericht wie upstream. Braucht am Repo `trusted.volumes = true` (Volume woodpecker-reports)
    # und das Secret github_status_token (nur repo:status) — beides Teil der Woodpecker-Aktivierung.
    # EIN FEHLENDES SECRET STARTET DIE PIPELINE GAR NICHT (gemessen upstream 02.09.2026).
    image: maven:3.10-eclipse-temurin-25
    when:
      - status: [success, failure]
    volumes:
      - woodpecker-reports:/reports
    environment:
      REPORT_BASE_URL: "https://reports.plaintext.ch"
      REPORT_KEEP: "30"
      GITHUB_STATUS_TOKEN:
        from_secret: github_status_token
    commands:
      - . .woodpecker/waechter.sh
      - sh .woodpecker/allure-bericht.sh
