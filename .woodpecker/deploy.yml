# ═══════════════════════════════════════════════════════════════════════════════
#  plaintext-root-v2 — Woodpecker workflow 2 of 3: RELEASE (Maven-Artefakt), Karte 1563
#
#  v2-FASSUNG (merge=ours in .gitattributes). Unterschiede zu upstream plaintext-root/deploy.yml:
#    * KEIN ./build / plaintext-scripts: v2/release.sh taggt (v2-<version>), setzt die Version nur
#      im Arbeitsbaum, `mvn clean deploy` in BEIDE Paket-Repos — kein Versions-Commit (der Sync
#      bliebe sonst an jeder pom.xml haengen), kein SNAPSHOT-Commit, keine Schleife.
#    * KEIN NAS-Staging, KEIN SSH-Schluessel, KEIN Docker-CLI (.m3-jar-volume liest nur ./build, das v2 nicht nutzt).
#    * KEIN Spiegel nach Plaintext-Gmbh/plaintext-mvn (git): v2 veroeffentlicht nur in GitHub
#      Packages und Reposilite.
#    * Vollstaendigkeitspruefung (Karte 1281) mit TAG_PRAEFIX=v2- und Gruppenpfad ch/plaintext/v2.
#
#  Veroeffentlicht wird unter groupId ch.plaintext.v2 — v2/release.sh verweigert jede andere.
#  Reihenfolge wie upstream (Karte 518): Tag raus, dann deploy; kein deployAtEnd (pom.xml).
#
#  Runs ONLY if `.ci-engine` contains the word `woodpecker` (waechter.sh).
# ═══════════════════════════════════════════════════════════════════════════════

when:
  - event: push
    branch: master
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      # Voll und mit Tags: v2/release.sh rechnet die naechste Nummer aus den v2-Tags.
      partial: false
      depth: 0
      tags: true

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: plaintext_root
      POSTGRES_USER: plaintext
      POSTGRES_PASSWORD: plaintext

steps:
  release:
    image: maven:3.10-eclipse-temurin-25
    environment:
      CI: "true"
      DEPLOY_TARGET: release-only
      GIT_TERMINAL_PROMPT: "0"
      # server-id `plaintext` (GitHub Packages) UND Push des Tags.
      MVN_DEPLOY_TOKEN:
        from_secret: mvn_deploy_token
      # server-id `plaintext-nas` (Reposilite, Profil dual-publish-nas aus .mvn/maven.config).
      MAVEN_NAS_TOKEN:
        from_secret: maven_nas_token
      # GitHub-Release mit generierten Notes (best effort) — derselbe Wert wie MVN_DEPLOY_TOKEN.
      GITHUB_TOKEN:
        from_secret: mvn_deploy_token
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plaintext_root
      SPRING_DATASOURCE_USERNAME: plaintext
      SPRING_DATASOURCE_PASSWORD: plaintext
      MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"
      REPOSILITE_BASIS: https://maven.plaintext.ch/releases
      TAG_PRAEFIX: "v2-"
    commands:
      - . .woodpecker/waechter.sh

      # ── 0. Was soll dieser Lauf tun? (Allowlist wie upstream: nur ci-only und release-only) ──
      - >-
        if [ "$CI_PIPELINE_EVENT" = "manual" ]; then
          DEPLOY_TARGET="${deploy_target:-ci-only}";
        fi;
        echo "DEPLOY_TARGET=$DEPLOY_TARGET (Ereignis: $CI_PIPELINE_EVENT)";
        case "$DEPLOY_TARGET" in
          ci-only)
            echo "ci-only — dieser Workflow veroeffentlicht nichts. Fuer ein Release im";
            echo "'Run pipeline'-Dialog die Variable deploy_target=release-only setzen.";
            exit 0
            ;;
          release-only)
            :
            ;;
          *)
            echo "FEHLER: deploy_target='$DEPLOY_TARGET' ist fuer plaintext-root-v2 gesperrt." >&2;
            echo "  Erlaubt sind NUR 'ci-only' und 'release-only'. v2 deployt nie einen Container." >&2;
            exit 1
            ;;
        esac

      # ── 1. gh (best effort, fuer das GitHub-Release mit Notes) ──────────────────────────
      - >-
        if curl -fsSL --retry 3 --retry-delay 5
        "https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz"
        | tar -xz -C /usr/local/bin --strip-components=2 --wildcards '*/bin/gh'; then
          gh --version;
        else
          echo "WARNUNG: gh liess sich nicht installieren. Release laeuft; nur das GitHub-Release mit Notes entfaellt.";
        fi

      # ── 2. Git: Identitaet, Zweig, Push-Zugang (Token ueber Credential-Helper in /tmp) ──
      - mkdir -p /tmp/ci && chmod 700 /tmp/ci
      - >-
        umask 077;
        printf 'https://x-access-token:%s@github.com\n' "$MVN_DEPLOY_TOKEN" > /tmp/ci/.git-credentials
      - git config --global credential.helper "store --file=/tmp/ci/.git-credentials"
      - git config --global user.email "woodpecker@plaintext.ch"
      - git config --global user.name "WoodpeckerCI"
      - git config --global --add safe.directory "$PWD"
      - git remote set-url origin "https://github.com/$CI_REPO.git"
      - git fetch --tags --force origin
      - git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"

      # ── 3. Maven-Zugangsdaten: BEIDE Server-IDs, in /tmp (nie im geteilten /root/.m2) ──
      - >-
        umask 077;
        printf '%s\n'
        '<settings>'
        '  <servers>'
        '    <server><id>plaintext</id><username>daniel-marthaler</username><password>'"$MVN_DEPLOY_TOKEN"'</password></server>'
        '    <server><id>plaintext-nas</id><username>ci</username><password>'"$MAVEN_NAS_TOKEN"'</password></server>'
        '  </servers>'
        '</settings>' > /tmp/ci/settings.xml
      - chmod 600 /tmp/ci/settings.xml
      - rm -f /root/.m2/settings.xml
      # Upload-Haertung wie upstream plaintext-root (Karte 1563, Laeufe 634/641 hingen je 46 min an
      # EINEM PUT nach maven.pkg.github.com): Lese-Timeout 5 min statt 30, 3 Wiederholungen im Abstand
      # von 5 s. Namen von Resolver 2.x (Maven 3.10); Begruendung ausfuehrlich in upstream deploy.yml.
      - >-
        export MAVEN_ARGS="-s /tmp/ci/settings.xml
        -Daether.transport.http.requestTimeout=300000
        -Daether.transport.http.retryHandler.count=3
        -Daether.transport.http.retryHandler.interval=5000"

      # ── 4. Testdatenbank ───────────────────────────────────────────────────────────────
      - >-
        bash -c 'for i in $(seq 1 60); do
          (echo > /dev/tcp/postgres/5432) 2>/dev/null && { echo "postgres bereit nach $i Versuchen"; exit 0; };
          sleep 2;
        done;
        echo "FEHLER: Service-Container postgres nicht erreichbar." >&2; exit 1'

      # ── 5. Halbe v2-Releases der Vergangenheit (Karte 1281), v2-Tags ────────────────────
      - >-
        case "$CI_COMMIT_MESSAGE" in
          *"[halbe-release-ok]"*)
            echo "[halbe-release-ok] gesetzt — Vollstaendigkeitspruefung uebersprungen." ;;
          *)
            bash scripts/release-vollstaendig.sh --letzte 10 ;;
        esac

      # ── 6. Release ─────────────────────────────────────────────────────────────────────
      # [fast] im Betreff -> -DskipTests (wie upstream), sonst Unit-Tests im einzigen Build.
      - bash v2/release.sh

  aufraeumen:
    image: maven:3.10-eclipse-temurin-25
    when:
      - status: [success, failure]
    commands:
      - 'rm -f /root/.m2/settings.xml && echo "Geteiltes Volume geprueft: kein settings.xml in /root/.m2."'

  # Zweite Haelfte der Vollstaendigkeitspruefung: das eben veroeffentlichte v2-Release gegen beide
  # Paket-Repos zaehlen. Eigener Container = eigener git-Stand mit dem frisch gepushten Tag.
  vollstaendigkeit:
    image: maven:3.10-eclipse-temurin-25
    when:
      - status: [success, failure]
    environment:
      PRUEFE_GITHUB: "1"
      TAG_PRAEFIX: "v2-"
      GITHUB_TOKEN:
        from_secret: mvn_deploy_token
    commands:
      - >-
        if [ "$CI_PIPELINE_EVENT" = "manual" ] && [ "${deploy_target:-ci-only}" != "release-only" ]; then
          echo "deploy_target=${deploy_target:-ci-only} — kein Release, nichts zu pruefen."; exit 0;
        fi;
        git config --global --add safe.directory "$PWD" || true;
        git fetch -q --tags --force origin || true;
        bash scripts/release-vollstaendig.sh
