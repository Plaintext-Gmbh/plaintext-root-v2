# ═══════════════════════════════════════════════════════════════════════════════
#  plaintext-root-v2 — sonar.yml: STUB, LAEUFT NIE (Karte 1563, Entscheid Daniel 22.10.2026)
#
#  Die woechentliche Voll-Analyse (SonarQube, OWASP-CVE, SpotBugs, Quality-Gate) bleibt bei
#  plaintext-root (v1). v2 ist derselbe Quelltext plus wenige eigene Dateien — eine zweite Analyse
#  misst dasselbe doppelt, belegt einen der zwei Agent-Slots fuer eine Stunde und schriebe ein
#  zweites quality-gate.properties. Die Secrets sonar_token, nvd_api_key, pushover_* liegen am
#  Repo ungenutzt.
#
#  WARUM EIN STUB UND KEIN GELOESCHTES FILE: upstream aendert seine sonar.yml regelmaessig. Eine in
#  v2 geloeschte Datei ergaebe bei jedem Sync einen Modify/Delete-Konflikt; eine vorhandene Datei
#  mit `merge=ours` (.gitattributes) bleibt still die v2-Fassung.
#
#  WARUM `evaluate` UND KEIN `event:`: ein `event: manual` liefe beim "Run pipeline"-Knopf mit
#  (und ein manueller Lauf startet in Woodpecker ALLE Workflows mit `event: manual`). Der Ausdruck
#  ist in diesem Repo nie wahr — der Workflow wird bei jedem Ereignis uebersprungen und
#  referenziert kein Secret, kann also auch keinen Start blockieren.
# ═══════════════════════════════════════════════════════════════════════════════

when:
  - evaluate: 'CI_REPO_NAME == "plaintext-root"'

steps:
  nie:
    image: alpine:3.21
    commands:
      - echo "v2 fuehrt keine Voll-Analyse aus (Stub)."
